<!DOCTYPE html>

<style>
  :root { --vert:#0b5d46; --vert2:#0f7a5c; --jaune:#f4b942; --sable:#efe7d6; --sortant:#d6edc6; --gris:#6b756f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#d9d4c7; color:#1c2420; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #app { height:100dvh; max-width:520px; margin:0 auto; background:#fff; position:relative; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 0 30px rgba(0,0,0,.15); }
  button { font:inherit; cursor:pointer; border:0; } input,select { font:inherit; }
  .top { background:var(--vert); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .top h1 { font-size:21px; margin:0; flex:1; } .top .ic { background:transparent; color:#fff; font-size:22px; padding:4px 8px; }
  .top b { font-size:17px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .av { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-weight:700; color:#fff; flex-shrink:0; font-size:18px; }
  .welcome { flex:1; overflow:auto; padding:calc(env(safe-area-inset-top,0px) + 34px) 26px 30px; display:flex; flex-direction:column; gap:8px; }
  .logo { width:72px; height:72px; } .logo svg { display:block; }
  .welcome h1 { margin:6px 0 0; font-size:30px; color:var(--vert); } .welcome p { margin:0 0 8px; color:var(--gris); line-height:1.4; }
  label { font-size:13.5px; font-weight:600; color:var(--vert); margin-top:6px; }
  .field { border:2px solid #d5dbd7; border-radius:12px; padding:13px 14px; font-size:17px; width:100%; background:#fff; }
  .field:focus { outline:none; border-color:var(--vert2); }
  .phone { display:flex; gap:8px; } .phone select { width:104px; flex-shrink:0; }
  .cta { background:var(--vert); color:#fff; padding:15px; border-radius:14px; font-size:17px; font-weight:700; margin-top:14px; } .cta:disabled { opacity:.6; }
  .note { font-size:13px; color:var(--gris); background:#f6f1e1; border-left:4px solid var(--jaune); padding:10px 12px; border-radius:6px; line-height:1.4; }
  .err { color:#c0392b; font-size:14px; min-height:18px; }
  .list { flex:1; overflow:auto; }
  .row { display:flex; gap:13px; padding:12px 14px; align-items:center; border-bottom:1px solid #eef0ee; width:100%; background:#fff; text-align:left; }
  .row:active { background:#f3f6f4; } .row .mid { flex:1; min-width:0; }
  .row .l1 { display:flex; justify-content:space-between; gap:8px; } .row .l1 b { font-size:17px; } .row .l1 span { font-size:12.5px; color:var(--gris); }
  .row .l2 { color:var(--gris); font-size:14.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fab { position:absolute; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); width:58px; height:58px; border-radius:18px; background:var(--jaune); color:#3b2a00; font-size:30px; box-shadow:0 6px 16px rgba(0,0,0,.25); }
  .empty,.center { padding:40px 24px; text-align:center; color:var(--gris); line-height:1.5; }
  .msgs { flex:1; overflow:auto; background:var(--sable); padding:12px 10px; display:flex; flex-direction:column; gap:4px; }
  .b { max-width:80%; padding:8px 11px 6px; border-radius:14px; font-size:16px; line-height:1.35; overflow-wrap:anywhere; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .b.in { background:#fff; align-self:flex-start; border-top-left-radius:4px; } .b.out { background:var(--sortant); align-self:flex-end; border-top-right-radius:4px; }
  .b .meta { float:right; margin:6px 0 0 10px; font-size:11px; color:var(--gris); }
  .bar { display:flex; gap:8px; padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px); background:#f2f2ee; flex-shrink:0; }
  .bar input { flex:1; border:0; border-radius:22px; padding:12px 16px; font-size:16px; min-width:0; } .bar input:focus { outline:none; }
  .send { width:46px; height:46px; border-radius:50%; background:var(--vert); color:#fff; font-size:20px; flex-shrink:0; }

  img.av { object-fit:cover; background:#ccc; } .top .ic .av { width:36px; height:36px; font-size:16px; }
  .strip { display:flex; gap:14px; padding:12px 14px; overflow-x:auto; border-bottom:1px solid #eef0ee; flex-shrink:0; }
  .st { background:none; display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; flex-shrink:0; }
  .st small { font-size:12px; color:var(--gris); max-width:64px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ring { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; padding:3px; border:3px dashed #c9d2cd; }
  .ring.on { border:3px solid var(--jaune); } .ring .av { width:100%; height:100%; font-size:20px; }
  .ring.add { font-size:26px; color:var(--vert); border-color:var(--vert2); }
  .mic { width:46px; height:46px; border-radius:50%; background:#fff; font-size:20px; flex-shrink:0; }
  .ic2 { background:none; font-size:20px; color:#c0392b; padding:0 10px; }
  .rec { flex:1; display:flex; align-items:center; gap:8px; color:#c0392b; font-weight:600; }
  .rec i { width:10px; height:10px; border-radius:50%; background:#c0392b; animation:bl 1s infinite; } @keyframes bl { 50% { opacity:.2; } }
  .b audio { width:230px; max-width:100%; height:40px; display:block; }
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet { background:#fff; width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; flex-direction:column; gap:10px; }
  .sheet button { padding:14px; border-radius:12px; background:#f0f4f1; font-size:17px; } .sheet .gr { background:none; color:var(--gris); }
  .sv { position:fixed; inset:0; background:#000; z-index:30; display:flex; flex-direction:column; color:#fff; }
  .bars { display:flex; gap:4px; padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px; } .bars i { flex:1; height:3px; background:rgba(255,255,255,.35); border-radius:2px; } .bars i.f { background:#fff; }
  .sh { display:flex; align-items:center; gap:10px; padding:6px 12px; position:relative; z-index:2; } .sh .av { width:36px; height:36px; font-size:15px; } .sh b { flex:1; } .sh span { font-size:12px; opacity:.7; } .sh button { background:none; color:#fff; font-size:20px; }
  .sb { flex:1; display:grid; place-items:center; min-height:0; } .sb img { max-width:100%; max-height:100%; object-fit:contain; }
  .tx { width:100vw; height:100%; display:grid; place-items:center; text-align:center; padding:30px; font-size:26px; font-weight:700; overflow-wrap:anywhere; }
  .zl, .zr { position:absolute; top:100px; bottom:0; width:50%; } .zl { left:0; } .zr { right:0; }
  .tabs { display:flex; background:#eef2ef; border-radius:12px; padding:4px; margin:6px 0 4px; } .tabs button { flex:1; padding:10px; border-radius:9px; background:none; font-weight:600; color:var(--gris); } .tabs button.on { background:#fff; color:var(--vert); box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .cta.out { background:#fff; color:#c0392b; border:2px solid #c0392b; } .cta.alt { background:#fff; color:var(--vert); border:2px solid var(--vert); }
  .row .l2 { display:flex; justify-content:space-between; gap:8px; } .row .l2 em { font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { background:var(--jaune); color:#3b2a00; font-weight:700; font-size:12.5px; min-width:22px; height:22px; border-radius:11px; display:grid; place-items:center; padding:0 6px; flex-shrink:0; }
  .top .who { flex:1; min-width:0; } .top .who b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .top .who small { font-size:12.5px; opacity:.85; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .b .nm { display:block; font-size:12.5px; font-weight:700; margin-bottom:2px; } .b .meta .t2 { color:#2f9bd8; }
  .pick { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:400; color:inherit; padding:6px 0; margin:0; } .pick .av { width:36px; height:36px; font-size:15px; } .pick small { color:var(--gris); } .pick input { width:20px; height:20px; }
  .ppic { background:none; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--vert); } .ppic .av { width:92px; height:92px; font-size:36px; }
</style>
</head>
<body>
<div id="app"><div class="center">Connexion…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, where, orderBy, limit, onSnapshot, getDocs, deleteDoc, increment, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDN1ORPl5BCOhD8pRcObxgtrZuMX9xsTM8",
  authDomain: "cronos-9b4e9.firebaseapp.com",
  projectId: "cronos-9b4e9",
  storageBucket: "cronos-9b4e9.firebasestorage.app",
  messagingSenderId: "758569211364",
  appId: "1:758569211364:web:a34b48f09cad4e2b0fe3f1"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);

const $ = id => document.getElementById(id), root = $('app');
const COUNTRIES = [['+229','Bénin'],['+228','Togo'],['+225','Côte d’Ivoire'],['+221','Sénégal'],['+233','Ghana'],['+234','Nigéria'],['+237','Cameroun'],['+33','France'],['+1','USA/Canada']];
const COLORS = ['#0f7a5c','#c0562e','#6a4fb3','#2a7fb5','#b5446e','#8a7a1c','#3f8a2e'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ms = t => t && t.toMillis ? t.toMillis() : (t || 0);
const hhmm = t => t ? new Date(t).toLocaleTimeString('fr', { hour: '2-digit', minute: '2-digit' }) : '';
const color = s => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const okImg = s => typeof s === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s);
const okAud = s => typeof s === 'string' && /^data:audio\/[a-z0-9.+-]+(;codecs=[a-z0-9.,]+)?;base64,[A-Za-z0-9+\/=]+$/i.test(s);
const BGS = ['#0b5d46', '#6a4fb3', '#c0562e', '#2a7fb5', '#b5446e'];
const av = (n, id) => { const p = id && users[id] && users[id].photo; return okImg(p) ? `<img class="av" src="${p}" alt="">` : `<div class="av" style="background:${color(n)}">${esc(n.trim().slice(0, 1).toUpperCase())}</div>`; };

let uid = null, me = null, chats = [], msgs = [], view = 'loading', openId = null, pend = null, unChats = null, unMsgs = null, tmp = { mode: 'login' },
    users = {}, stories = [], unUsers = null, unStories = null, rec = null, svT = null, busy = false, firstChats = true, seenUn = {};
const LOGO = `<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="72" height="72"><rect width="100" height="100" rx="22" fill="#0b5d46"/><g transform="translate(50 50) scale(1) translate(-50 -50)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M72.98 69.28 A30 30 0 1 1 72.98 30.72" stroke="#f4b942" stroke-width="11"/><path d="M43 34 V66 M43 34 H55 A9 9 0 0 1 55 52 H43 M53 52 L62 66" stroke="#fff" stroke-width="6.5"/></g></svg></div>`;
const mail = p => p.replace(/\D/g, '') + '@brother.app';
const nm = id => (users[id] && users[id].name) || 'Contact';
const chatOf = id => chats.find(c => c.id === id) || (pend && pend.id === id ? pend : null);
const otherId = c => c.members.find(m => m !== uid);
const chatTitle = c => c.group ? (c.name || 'Groupe') : nm(otherId(c));
const unreadOf = c => (c.unread && c.unread[uid]) || 0;

function fatal(msg) { root.innerHTML = `<div class="center"><b>Oups</b><br>${esc(msg)}<br><br><button class="cta" onclick="location.reload()">Réessayer</button></div>`; }
function errText(e) {
  const c = e && e.code || '';
  if (c.includes('operation-not-allowed')) return 'Active « E-mail/Mot de passe » dans Firebase (Authentification → Méthode de connexion).';
  if (c.includes('permission')) return 'Action refusée. Vérifie le code d’invitation et les règles Firestore.';
  if (c.includes('unavailable') || c.includes('network')) return 'Pas de connexion internet.';
  if (c.includes('too-many')) return 'Trop d’essais. Réessaie dans quelques minutes.';
  return 'Erreur : ' + (c || (e && e.message) || 'inconnue');
}
function stopSubs() {
  [unChats, unUsers, unStories, unMsgs].forEach(f => f && f());
  unChats = unUsers = unStories = unMsgs = null; chats = []; users = {}; stories = []; msgs = []; firstChats = true; seenUn = {}; pend = null; openId = null;
}
function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); o.stop(a.currentTime + .12); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(80);
}

onAuthStateChanged(auth, async u => {
  if (busy) return;
  if (u && u.isAnonymous) { await signOut(auth); return; }
  if (!u) { stopSubs(); uid = null; me = null; view = 'welcome'; render(); return; }
  uid = u.uid;
  try {
    const s = await getDoc(doc(db, 'users', uid));
    if (s.exists()) { me = s.data(); showList(); cleanStories(); } else { view = 'complete'; render(); }
  } catch (e) { fatal(errText(e)); }
});

function render() { ({ welcome: renderWelcome, complete: renderComplete, list: renderList, new: renderNew, group: renderGroup, profile: renderProfile, chat: renderChat }[view] || (() => {}))(); }
function phoneBlock() {
  return `<label>Ton numéro</label><div class="phone"><select class="field" id="cc">${COUNTRIES.map(c => `<option ${c[0] === (tmp.cc || '+229') ? 'selected' : ''}>${c[0]}</option>`).join('')}</select>
  <input class="field" id="num" inputmode="tel" placeholder="97 00 00 00" value="${esc(tmp.num || '')}"></div>`;
}
const readPhone = () => { const cc = $('cc').value, num = $('num').value.replace(/\D/g, '').replace(/^0+/, ''); tmp.cc = cc; tmp.num = num; return { ok: num.length >= 8, phone: cc + num }; };
function saveTmp() { if ($('name')) tmp.name = $('name').value; if ($('inv')) tmp.inv = $('inv').value; if ($('num')) readPhone(); }

function renderWelcome() {
  const su = tmp.mode === 'signup';
  root.innerHTML = `<div class="welcome">${LOGO}<h1>Brother</h1><p>Discute avec tes potes grâce à ton numéro.</p>
    <div class="tabs"><button id="tl" class="${su ? '' : 'on'}">Se connecter</button><button id="ts" class="${su ? 'on' : ''}">S’inscrire</button></div>
    ${su ? `<label>Ton prénom</label><input class="field" id="name" maxlength="30" placeholder="Ex : Moussa" value="${esc(tmp.name || '')}">` : ''}
    ${phoneBlock()}
    <label>Mot de passe</label><input class="field" id="pw" type="password" autocomplete="${su ? 'new-password' : 'current-password'}" placeholder="6 caractères minimum">
    ${su ? `<label>Code d’invitation</label><input class="field" id="inv" autocapitalize="off" placeholder="Donné par ton pote" value="${esc(tmp.inv || '')}">` : ''}
    <div class="err" id="err"></div><button class="cta" id="go">${su ? 'Créer mon compte' : 'Se connecter'}</button>
    <div class="note">${su ? 'Aucun SMS : seuls ceux qui ont le code d’invitation peuvent s’inscrire. Retiens bien ton mot de passe : il n’y a pas de récupération automatique.' : 'Tu peux te reconnecter sur n’importe quel téléphone avec ton numéro et ton mot de passe.'}</div></div>`;
  $('tl').onclick = () => { saveTmp(); tmp.mode = 'login'; renderWelcome(); };
  $('ts').onclick = () => { saveTmp(); tmp.mode = 'signup'; renderWelcome(); };
  $('go').onclick = su ? doSignup : doLogin;
}
async function doSignup() {
  const name = $('name').value.trim(), inv = $('inv').value.trim(), pw = $('pw').value, p = readPhone(), err = $('err'); tmp.name = name; tmp.inv = inv;
  if (!name) return err.textContent = 'Entre ton prénom.';
  if (!p.ok) return err.textContent = 'Numéro trop court (8 chiffres minimum).';
  if (pw.length < 6) return err.textContent = 'Mot de passe : 6 caractères minimum.';
  if (!inv) return err.textContent = 'Entre le code d’invitation.';
  $('go').disabled = true; err.textContent = ''; busy = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, mail(p.phone), pw);
    try { await setDoc(doc(db, 'users', cred.user.uid), { name, phone: p.phone, invite: inv, createdAt: serverTimestamp() }); }
    catch (e) { try { await deleteUser(cred.user); } catch (x) {} throw e; }
    uid = cred.user.uid; me = { name, phone: p.phone }; busy = false; showList(); cleanStories();
  } catch (e) {
    setTimeout(() => { busy = false; }, 400); $('go').disabled = false;
    const c = e.code || '';
    err.textContent = c.includes('email-already') ? 'Ce numéro a déjà un compte. Touche « Se connecter ».' : c.includes('permission') ? 'Code d’invitation incorrect.' : c.includes('weak') ? 'Mot de passe trop faible.' : errText(e);
  }
}
async function doLogin() {
  const p = readPhone(), pw = $('pw').value, err = $('err');
  if (!p.ok) return err.textContent = 'Numéro trop court (8 chiffres minimum).';
  if (!pw) return err.textContent = 'Entre ton mot de passe.';
  $('go').disabled = true; err.textContent = '';
  try { await signInWithEmailAndPassword(auth, mail(p.phone), pw); }
  catch (e) { $('go').disabled = false; const c = e.code || ''; err.textContent = (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) ? 'Numéro ou mot de passe incorrect.' : errText(e); }
}
function renderComplete() {
  root.innerHTML = `<div class="welcome">${LOGO}<h1>Dernière étape</h1><p>Ton compte existe, il manque ton prénom et le code d’invitation.</p><label>Ton prénom</label><input class="field" id="name" maxlength="30"><label>Code d’invitation</label><input class="field" id="inv" autocapitalize="off"><div class="err" id="err"></div><button class="cta" id="go">Valider</button><button class="cta out" id="lo">Se déconnecter</button></div>`;
  $('lo').onclick = () => signOut(auth);
  $('go').onclick = async () => {
    const name = $('name').value.trim(), inv = $('inv').value.trim(); if (!name || !inv) return $('err').textContent = 'Remplis les deux champs.';
    const phone = '+' + ((auth.currentUser && auth.currentUser.email) || '').split('@')[0];
    try { await setDoc(doc(db, 'users', uid), { name, phone, invite: inv, createdAt: serverTimestamp() }); me = { name, phone }; showList(); cleanStories(); }
    catch (e) { $('err').textContent = (e.code || '').includes('permission') ? 'Code d’invitation incorrect.' : errText(e); }
  };
}

function showList() {
  view = 'list'; render();
  if (unChats) unChats();
  startSubs();
  unChats = onSnapshot(query(collection(db, 'chats'), where('members', 'array-contains', uid)), snap => {
    chats = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })).sort((a, b) => ms(b.lastAt) - ms(a.lastAt));
    let ring = false;
    chats.forEach(c => { const n = unreadOf(c); if (!firstChats && n > (seenUn[c.id] || 0) && c.lastFrom !== uid) ring = true; seenUn[c.id] = n; });
    firstChats = false; if (ring) beep();
    if (view === 'list') renderList(); else if (view === 'chat') { drawMsgs(); markRead(); }
  }, e => { if (view === 'list') fatal(errText(e)); });
}
function renderList() {
  root.innerHTML = `<div class="top"><h1>Brother</h1><button class="ic" id="me" aria-label="Mon profil">${av(me.name, uid)}</button></div>${stripHTML()}<div class="list">${chats.length ? chats.map(c => {
    const t = chatTitle(c), un = unreadOf(c);
    return `<button class="row" data-id="${c.id}">${c.group ? av(t) : av(t, otherId(c))}<div class="mid"><div class="l1"><b>${esc(t)}</b><span>${hhmm(ms(c.lastAt))}</span></div><div class="l2"><em>${esc(c.last || 'Nouvelle discussion')}</em>${un ? `<div class="badge">${un}</div>` : ''}</div></div></button>`;
  }).join('') : `<div class="empty">Aucune discussion.<br>Touche + pour écrire à un ami ou créer un groupe.</div>`}</div>
  <button class="fab" id="add" aria-label="Nouvelle discussion">+</button>`;
  root.querySelectorAll('.row').forEach(r => r.onclick = () => openChat(r.dataset.id));
  $('add').onclick = () => { view = 'new'; render(); };
  $('me').onclick = () => { view = 'profile'; render(); };
  $('addst').onclick = addStory;
  root.querySelectorAll('.st[data-u]').forEach(b => b.onclick = () => viewStories(b.dataset.u));
}

function renderNew() {
  root.innerHTML = `<div class="top"><button class="ic" id="back">←</button><h1>Nouvelle discussion</h1></div>
  <div class="welcome" style="padding-top:20px"><p>Entre le numéro de ton ami (il doit être inscrit sur Brother).</p>${phoneBlock().replace('Ton numéro', 'Numéro de ton ami')}
  <div class="err" id="err"></div><button class="cta" id="go">Chercher et discuter</button><button class="cta alt" id="grp">👥 Créer un groupe</button></div>`;
  $('back').onclick = () => { view = 'list'; render(); };
  $('grp').onclick = () => { view = 'group'; render(); };
  $('go').onclick = async () => {
    const p = readPhone(); if (!p.ok) return $('err').textContent = 'Numéro trop court (8 chiffres minimum).';
    $('go').disabled = true; $('err').textContent = '';
    try {
      const s = await getDocs(query(collection(db, 'users'), where('phone', '==', p.phone)));
      const found = s.docs.filter(d => d.id !== uid).map(d => ({ uid: d.id, ...d.data({ serverTimestamps: 'estimate' }) })).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
      if (!found.length) { $('go').disabled = false; return $('err').textContent = 'Personne d’inscrit avec ce numéro. Ton ami doit d’abord s’inscrire.'; }
      tmp.num = ''; openDirect(found[0]);
    } catch (e) { $('go').disabled = false; $('err').textContent = errText(e); }
  };
}
function renderGroup() {
  const by = {};
  Object.entries(users).forEach(([id, u]) => { if (id !== uid && (!by[u.phone] || ms(u.createdAt) > ms(by[u.phone][1].createdAt))) by[u.phone] = [id, u]; });
  const list = Object.values(by).sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));
  root.innerHTML = `<div class="top"><button class="ic" id="back">←</button><h1>Nouveau groupe</h1></div><div class="welcome" style="padding-top:20px"><label>Nom du groupe</label><input class="field" id="gn" maxlength="30" placeholder="Ex : Les potes"><label>Participants</label>${list.length ? list.map(([id, u]) => `<label class="pick"><input type="checkbox" value="${id}">${av(u.name || '?', id)}<span>${esc(u.name || 'Ami')} <small>${esc(u.phone || '')}</small></span></label>`).join('') : '<p>Personne d’autre n’est inscrit pour l’instant.</p>'}<div class="err" id="err"></div><button class="cta" id="go">Créer le groupe</button></div>`;
  $('back').onclick = () => { view = 'new'; render(); };
  $('go').onclick = async () => {
    const name = $('gn').value.trim(), ids = [...root.querySelectorAll('.pick input:checked')].map(i => i.value);
    if (!name) return $('err').textContent = 'Donne un nom au groupe.';
    if (!ids.length) return $('err').textContent = 'Choisis au moins un participant.';
    $('go').disabled = true;
    try { const members = [uid, ...ids].slice(0, 30); const ref = await addDoc(collection(db, 'chats'), { members, group: true, name, admin: uid }); pend = { id: ref.id, members, group: true, name }; openChat(ref.id); }
    catch (e) { $('go').disabled = false; $('err').textContent = errText(e); }
  };
}
function renderProfile() {
  const u = users[uid] || {};
  root.innerHTML = `<div class="top"><button class="ic" id="back">←</button><h1>Mon profil</h1></div><div class="welcome" style="padding-top:20px"><button class="ppic" id="pp">${av(me.name, uid)}<small>Changer la photo</small></button>
  <label>Prénom</label><input class="field" id="pn" maxlength="30" value="${esc(u.name || me.name)}"><label>Description</label><input class="field" id="pb" maxlength="80" placeholder="Ex : Monteur vidéo à Parakou" value="${esc(u.bio || '')}">
  <div class="err" id="err"></div><button class="cta" id="ps">Enregistrer</button><button class="cta out" id="lo">Se déconnecter</button><div class="note">Ton numéro : ${esc(me.phone)}</div></div>`;
  $('back').onclick = () => { view = 'list'; render(); };
  $('pp').onclick = changePhoto;
  $('ps').onclick = async () => {
    const name = $('pn').value.trim(), bio = $('pb').value.trim(); if (!name) return $('err').textContent = 'Le prénom ne peut pas être vide.';
    try { await setDoc(doc(db, 'users', uid), { name, bio }, { merge: true }); me.name = name; view = 'list'; render(); } catch (e) { $('err').textContent = errText(e); }
  };
  $('lo').onclick = () => { if (confirm('Te déconnecter ?')) signOut(auth); };
}

async function openDirect(o) {
  const id = [uid, o.uid].sort().join('_');
  if (!chats.find(c => c.id === id)) {
    pend = { id, members: [uid, o.uid].sort() };
    try { await setDoc(doc(db, 'chats', id), { members: pend.members }, { merge: true }); } catch (e) { return alert(errText(e)); }
  }
  openChat(id);
}
function openChat(id) {
  openId = id; msgs = []; view = 'chat'; render();
  if (unMsgs) unMsgs();
  unMsgs = onSnapshot(query(collection(db, 'chats', id, 'messages'), orderBy('at'), limit(300)), snap => {
    msgs = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })); drawMsgs();
  }, e => alert(errText(e)));
  markRead(true);
}
function markRead(force) {
  const c = chatOf(openId); if (!c || view !== 'chat') return;
  if (force || unreadOf(c) > 0) setDoc(doc(db, 'chats', openId), { unread: { [uid]: 0 }, reads: { [uid]: Date.now() } }, { merge: true }).catch(() => {});
}
function touchChat(cid, last) {
  const c = chatOf(cid), un = {}; (c ? c.members : []).filter(m => m !== uid).forEach(m => un[m] = increment(1));
  return setDoc(doc(db, 'chats', cid), { last, lastAt: serverTimestamp(), lastFrom: uid, unread: un, reads: { [uid]: Date.now() } }, { merge: true });
}
function drawMsgs() {
  const box = $('msgs'); if (!box) return;
  const c = chatOf(openId), others = c ? c.members.filter(m => m !== uid) : [];
  box.innerHTML = msgs.map(m => {
    const out = m.from === uid, seen = out && others.length && others.every(o => ((c.reads && c.reads[o]) || 0) >= ms(m.at));
    const who = !out && c && c.group ? `<span class="nm" style="color:${color(nm(m.from))}">${esc(nm(m.from))}</span>` : '';
    return `<div class="b ${out ? 'out' : 'in'}">${who}${bodyOf(m)}<span class="meta">${hhmm(ms(m.at))} ${out ? (seen ? '<span class="t2">✓✓</span>' : '✓') : ''}</span></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}
function renderChat() {
  const c = chatOf(openId), t = c ? chatTitle(c) : 'Discussion', oid = c && !c.group ? otherId(c) : null;
  const sub = c && c.group ? c.members.map(nm).join(', ') : (oid && users[oid] && users[oid].bio) || '';
  root.innerHTML = `<div class="top"><button class="ic" id="back">←</button>${c && c.group ? av(t) : av(t, oid)}<div class="who"><b>${esc(t)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div></div><div class="msgs" id="msgs"></div><div class="bar" id="bar"></div>`;
  $('back').onclick = () => { if (rec) stopRec(false); if (unMsgs) unMsgs(); unMsgs = null; showList(); };
  renderBar(); drawMsgs();
}
function renderBar() {
  const bar = $('bar'); if (!bar) return;
  if (rec) {
    bar.innerHTML = `<button class="ic2" id="rc" aria-label="Annuler">✕</button><div class="rec"><i></i><span id="rt">0:00</span> Enregistrement…</div><button class="send" id="rs" aria-label="Envoyer le vocal">➤</button>`;
    $('rc').onclick = () => stopRec(false); $('rs').onclick = () => stopRec(true); return;
  }
  bar.innerHTML = `<input id="txt" maxlength="1000" placeholder="Écris un message" autocomplete="off"><button class="mic" id="mic" aria-label="Message vocal">🎤</button><button class="send" id="send" aria-label="Envoyer">➤</button>`;
  const go = async () => {
    const t = $('txt').value.trim(); if (!t) return; $('txt').value = ''; $('txt').focus();
    try {
      await addDoc(collection(db, 'chats', openId, 'messages'), { from: uid, text: t, at: serverTimestamp() });
      await touchChat(openId, t.slice(0, 80));
    } catch (e) { alert(errText(e)); }
  };
  $('send').onclick = go; $('txt').onkeydown = e => { if (e.key === 'Enter') go(); }; $('mic').onclick = startRec;
}
function bodyOf(m) { return m.audio && okAud(m.audio) ? `<audio controls preload="metadata" src="${m.audio}"></audio>` : esc(m.text); }
async function cleanStories() {
  try { const q = await getDocs(query(collection(db, 'stories'), where('uid', '==', uid))); q.docs.forEach(d => { if ((d.data().expiresAt || 0) < Date.now()) deleteDoc(doc(db, 'stories', d.id)).catch(() => {}); }); } catch (e) {}
}

/* ---- Messages vocaux (60 s max, rangés dans la base) ---- */
async function startRec() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return alert('Ton navigateur ne permet pas d’enregistrer.');
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return alert('Autorise le micro pour envoyer un vocal.'); }
  const mt = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const mr = new MediaRecorder(stream, mt ? { mimeType: mt, audioBitsPerSecond: 24000 } : {});
  rec = { mr, stream, chunks: [], t0: Date.now(), send: false, cid: openId };
  mr.ondataavailable = e => { if (e.data.size) rec.chunks.push(e.data); };
  mr.onstop = finishRec; mr.start();
  rec.timer = setInterval(() => { const x = Math.floor((Date.now() - rec.t0) / 1000), t = $('rt'); if (t) t.textContent = Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); if (x >= 60) stopRec(true); }, 250);
  renderBar();
}
function stopRec(send) { if (!rec) return; clearInterval(rec.timer); rec.send = send; try { rec.mr.stop(); } catch (e) { finishRec(); } }
async function finishRec() {
  const r = rec; if (!r) return; rec = null; r.stream.getTracks().forEach(t => t.stop()); renderBar();
  const dur = Math.round((Date.now() - r.t0) / 1000);
  if (!r.send || dur < 1) return;
  const blob = new Blob(r.chunks, { type: r.mr.mimeType || 'audio/webm' });
  const data = await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(blob); });
  if (!okAud(data) || data.length > 700000) return alert('Vocal illisible ou trop long.');
  try {
    await addDoc(collection(db, 'chats', r.cid, 'messages'), { from: uid, text: '🎤 Message vocal', audio: data, dur, at: serverTimestamp() });
    await touchChat(r.cid, '🎤 Message vocal');
  } catch (e) { alert(errText(e)); }
}

/* ---- Photos, profils et statuts ---- */
function startSubs() {
  if (!unUsers) unUsers = onSnapshot(collection(db, 'users'), q => { users = {}; q.docs.forEach(d => users[d.id] = d.data({ serverTimestamps: 'estimate' })); if (view === 'list') renderList(); else if (view === 'chat') drawMsgs(); else if (view === 'profile' && $('pp')) $('pp').firstElementChild.outerHTML = av(me.name, uid); }, () => {});
  if (!unStories) unStories = onSnapshot(query(collection(db, 'stories'), where('expiresAt', '>', Date.now())), q => { stories = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.at - b.at); if (view === 'list') renderList(); }, () => {});
}
function pickImage(max, quality) {
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return res(null);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => res(null); img.src = URL.createObjectURL(f);
    };
    inp.click();
  });
}
async function changePhoto() {
  const p = await pickImage(160, .7); if (!p) return;
  try { await setDoc(doc(db, 'users', uid), { photo: p }, { merge: true }); } catch (e) { alert(errText(e)); }
}
const nameOf = id => id === uid ? 'Mon statut' : ((users[id] && users[id].name) || 'Ami');
function stripHTML() {
  const act = stories.filter(s => s.expiresAt > Date.now()), by = {};
  act.forEach(s => (by[s.uid] = by[s.uid] || []).push(s));
  const ids = Object.keys(by).sort((a, b) => a === uid ? -1 : b === uid ? 1 : by[b][by[b].length - 1].at - by[a][by[a].length - 1].at);
  return `<div class="strip"><button class="st" id="addst"><div class="ring add">+</div><small>Ajouter</small></button>${ids.map(id => `<button class="st" data-u="${id}"><div class="ring on">${av(nameOf(id), id)}</div><small>${esc(nameOf(id))}</small></button>`).join('')}</div>`;
}
function addStory() {
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = `<div class="sheet"><b>Nouveau statut (24 h)</b><button id="sp">📷 Photo</button><button id="stx">✏️ Texte</button><button id="sc" class="gr">Annuler</button></div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.querySelector('#sc').onclick = close;
  o.querySelector('#sp').onclick = async () => { close(); const p = await pickImage(720, .6); if (p) postStory({ type: 'image', img: p }); };
  o.querySelector('#stx').onclick = () => { close(); const t = (prompt('Écris ton statut') || '').trim().slice(0, 200); if (t) postStory({ type: 'text', text: t, bg: BGS[Math.floor(Math.random() * BGS.length)] }); };
}
async function postStory(d) {
  const now = Date.now();
  try { await addDoc(collection(db, 'stories'), { uid, ...d, at: now, expiresAt: now + 864e5 }); } catch (e) { alert(errText(e)); }
}
function viewStories(id) {
  const list = stories.filter(x => x.uid === id && x.expiresAt > Date.now()); if (!list.length) return;
  let i = 0; const o = document.createElement('div'); o.className = 'sv'; document.body.appendChild(o);
  const end = () => { clearTimeout(svT); o.remove(); };
  const next = () => { if (i < list.length - 1) { i++; show(); } else end(); };
  function show() {
    clearTimeout(svT); const x = list[i];
    const body = x.type === 'image' && okImg(x.img) ? `<img src="${x.img}" alt="">` : `<div class="tx" style="background:${BGS.includes(x.bg) ? x.bg : BGS[0]}">${esc(x.text || '')}</div>`;
    o.innerHTML = `<div class="bars">${list.map((_, k) => `<i class="${k <= i ? 'f' : ''}"></i>`).join('')}</div><div class="sh">${av(nameOf(id), id)}<b>${esc(nameOf(id))}</b><span>${hhmm(x.at)}</span>${id === uid ? '<button id="sdel">🗑</button>' : ''}<button id="sx">✕</button></div><div class="sb">${body}</div><div class="zl"></div><div class="zr"></div>`;
    o.querySelector('#sx').onclick = end;
    const d = o.querySelector('#sdel'); if (d) d.onclick = async () => { if (confirm('Supprimer ce statut ?')) { try { await deleteDoc(doc(db, 'stories', x.id)); } catch (e) {} end(); } };
    o.querySelector('.zl').onclick = () => { if (i > 0) { i--; show(); } };
    o.querySelector('.zr').onclick = next; svT = setTimeout(next, 5000);
  }
  show();
}
</script>
