<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230b5d46%22/%3E%3Cg transform=%22translate%2850 50%29 scale%281%29 translate%28-50 -50%29%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M72.98 69.28 A30 30 0 1 1 72.98 30.72%22 stroke=%22%23f4b942%22 stroke-width=%2211%22/%3E%3Cpath d=%22M43 34 V66 M43 34 H55 A9 9 0 0 1 55 52 H43 M53 52 L62 66%22 stroke=%22%23fff%22 stroke-width=%226.5%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brother">
<title>Brother</title>
<style>
  :root {
    --vert:#0f766e; --vert2:#115e59; --accent:#10b981; --accent-pill:#d1fae5; --accent-pill-txt:#065f46;
    --jaune:#f59e0b; --sable:#f4f6f8; --sortant:#d1fae5; --gris:#64748b;
    --fond-ext:#e2e8f0; --surface:#ffffff; --header-bg:rgba(255,255,255,.92); --header-txt:#0f172a;
    --ligne:#e2e8f0; --barre:#f1f5f9; --texte:#0f172a; --champ-bord:#cbd5e1;
    --note-bg:#f8fafc; --tab-bg:#e2e8f0; --sheet-btn:#f1f5f9; --search-bg:#f1f5f9;
    --fab-bg:linear-gradient(135deg,#10b981,#0f766e); --fab-txt:#ffffff;
    --card-bg:#ffffff; --card-shadow:0 6px 20px rgba(15,23,42,.06);
  }
  body.dark {
    --vert:#10b981; --vert2:#34d399; --accent:#10b981; --accent-pill:rgba(16,185,129,.18); --accent-pill-txt:#34d399;
    --fond-ext:#060b10; --surface:#0b1219; --header-bg:rgba(11,18,25,.92); --header-txt:#f1f5f9;
    --sable:#080e14; --sortant:linear-gradient(135deg,#065f46,#047857); --gris:#94a3b8; --ligne:#17222e;
    --barre:#131d28; --texte:#f1f5f9; --champ-bord:#223142; --note-bg:#111b26;
    --tab-bg:#131d28; --sheet-btn:#16222f; --search-bg:#131d28;
    --fab-bg:linear-gradient(135deg,#10b981,#059669); --fab-txt:#042f2e;
    --card-bg:#101923; --card-shadow:0 8px 24px rgba(0,0,0,.32);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; background:var(--fond-ext); color:var(--texte); font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #app { height:100%; height:100dvh; max-width:520px; margin:0 auto; background:var(--surface); position:relative; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 0 45px rgba(0,0,0,.38); }
  button { font:inherit; cursor:pointer; border:0; color:inherit; } input,select,textarea { font:inherit; color:inherit; }

  /* Header moderne translucide */
  .top { background:var(--header-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--header-txt); padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px; display:flex; align-items:center; gap:10px; flex-shrink:0; border-bottom:1px solid var(--ligne); z-index:4; }
  .top.main-top { border-bottom:0; padding-bottom:6px; }
  .brand-wrap { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .brand-img { width:34px; height:34px; border-radius:11px; overflow:hidden; flex-shrink:0; box-shadow:0 3px 10px rgba(16,185,129,.25); }
  .brand-img svg { width:34px; height:34px; display:block; }
  .top h1 { font-size:24px; font-weight:800; margin:0; flex:1; letter-spacing:-0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:linear-gradient(120deg,var(--vert2),var(--jaune)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .top .ic { background:var(--search-bg); color:var(--header-txt); width:38px; height:38px; padding:0; border-radius:12px; display:grid; place-items:center; flex-shrink:0; transition:transform .12s, background .15s; }
  .top .ic:active { transform:scale(.92); background:var(--accent-pill); color:var(--accent-pill-txt); }
  .top b { font-size:17px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Avatars agrandis et nets */
  .av { width:56px; height:56px; border-radius:18px; display:grid; place-items:center; font-weight:800; color:#fff; flex-shrink:0; font-size:21px; box-shadow:0 3px 10px rgba(0,0,0,.18); }
  img.av { object-fit:cover; background:#1e293b; border:2px solid rgba(16,185,129,.35); }
  .top .av { width:44px; height:44px; border-radius:15px; font-size:17px; cursor:zoom-in; }

  /* Barre de recherche & Filtres (Pills modernes) */
  .search-wrap { padding:4px 14px 8px; background:var(--surface); flex-shrink:0; }
  .search-box { display:flex; align-items:center; gap:10px; background:var(--search-bg); border:1px solid var(--ligne); border-radius:16px; padding:10px 14px; color:var(--gris); transition:border-color .15s; }
  .search-box:focus-within { border-color:var(--accent); }
  .search-box .i { width:19px; height:19px; flex-shrink:0; color:var(--accent); }
  .search-box input { flex:1; border:0; background:transparent; font-size:15.5px; color:var(--texte); min-width:0; }
  .search-box input:focus { outline:none; }
  .search-box input::placeholder { color:var(--gris); }
  .search-clear { background:none; color:var(--gris); padding:2px; display:grid; place-items:center; }

  .chips { display:flex; gap:8px; padding:2px 14px 10px; overflow-x:auto; flex-shrink:0; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { background:var(--search-bg); color:var(--gris); font-size:13px; font-weight:700; padding:7px 15px; border-radius:12px; border:1px solid var(--ligne); white-space:nowrap; flex-shrink:0; transition:all .15s; }
  .chip.on { background:var(--accent-pill); color:var(--accent-pill-txt); border-color:var(--accent); }

  /* Welcome / Login / Forms */
  .welcome { flex:1; overflow:auto; padding:calc(env(safe-area-inset-top,0px) + 28px) 22px 30px; display:flex; flex-direction:column; gap:9px; }
  .logo { width:76px; height:76px; border-radius:22px; box-shadow:0 10px 25px rgba(16,185,129,.25); } .logo svg { display:block; }
  .welcome h1 { margin:6px 0 0; font-size:31px; font-weight:800; color:var(--vert2); letter-spacing:-0.6px; }
  .welcome p { margin:0 0 8px; color:var(--gris); line-height:1.45; }
  label { font-size:13px; font-weight:700; color:var(--vert2); margin-top:6px; text-transform:uppercase; letter-spacing:.4px; }
  .field { border:1.5px solid var(--champ-bord); border-radius:14px; padding:13px 14px; font-size:16px; width:100%; background:var(--card-bg); transition:border-color .15s; }
  .field:focus { outline:none; border-color:var(--accent); }
  .phone { display:flex; gap:8px; } .phone select { width:108px; flex-shrink:0; }
  .cta { background:var(--fab-bg); color:#fff; padding:14px 18px; border-radius:16px; font-size:16px; font-weight:700; margin-top:10px; box-shadow:0 6px 16px rgba(16,185,129,.25); transition:transform .1s; }
  .cta:active { transform:scale(.98); } .cta:disabled { opacity:.6; }
  .note { font-size:13px; color:var(--gris); background:var(--note-bg); border:1px solid var(--ligne); border-left:4px solid var(--jaune); padding:11px 13px; border-radius:12px; line-height:1.45; }
  .err { color:#f43f5e; font-size:14px; min-height:18px; font-weight:600; }

  /* Liste des discussions fluide sans encadrement (page fixe, seule la liste défile) */
  .list { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:2px 0 92px; display:flex; flex-direction:column; gap:0; }
  .row { display:flex; gap:14px; padding:12px 16px; align-items:center; width:100%; background:transparent; border:0; border-bottom:1px solid var(--ligne); border-radius:0; text-align:left; box-shadow:none; transition:background .15s; }
  .row:hover { background:rgba(16,185,129,.04); }
  .row:active { background:var(--barre); } .row .mid { flex:1; min-width:0; }
  .row .l1 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .row .l1 b { font-size:16.5px; font-weight:700; color:var(--texte); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .row .l1 span { font-size:12px; color:var(--gris); flex-shrink:0; }
  .row .l1 span.un-t { color:var(--accent); font-weight:700; }
  .row .l2 { color:var(--gris); font-size:14px; margin-top:4px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .row .l2 em { font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px; }
  .tick-row { font-size:13px; color:var(--gris); flex-shrink:0; }
  .tick-row.seen { color:#38bdf8; }

  .fab { position:absolute; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); width:58px; height:58px; border-radius:20px; background:var(--fab-bg); color:#fff; box-shadow:0 8px 22px rgba(16,185,129,.4); display:grid; place-items:center; transition:transform .12s; z-index:5; }
  .fab:active { transform:scale(.92); }
  .fab .i { width:26px; height:26px; stroke-width:2.5; }
  .empty,.center { padding:44px 24px; text-align:center; color:var(--gris); line-height:1.5; font-size:15px; }

  /* Zone de chat */
  .msgs { flex:1; overflow:auto; background-color:var(--sable); background-image:radial-gradient(rgba(16,185,129,.1) 1.2px,transparent 1.3px); background-size:22px 22px; padding:14px 12px; display:flex; flex-direction:column; gap:6px; }
  .b { max-width:82%; padding:9px 13px 7px; font-size:15.5px; line-height:1.38; overflow-wrap:anywhere; box-shadow:0 2px 6px rgba(0,0,0,.12); position:relative; animation:pop .16s ease-out; }
  .b.in { background:var(--card-bg); border:1px solid var(--ligne); align-self:flex-start; border-radius:18px 18px 18px 5px; }
  .b.out { background:var(--sortant); color:#fff; align-self:flex-end; border-radius:18px 18px 5px 18px; }
  body:not(.dark) .b.out { color:#064e3b; }
  @keyframes pop{from{opacity:0;transform:translateY(5px)}}
  .b .meta { float:right; margin:6px 0 0 10px; font-size:11px; opacity:.8; display:inline-flex; align-items:center; gap:4px; }
  .b .del-msg { background:none; padding:0; display:inline-grid; place-items:center; width:18px; height:18px; opacity:.7; }
  .b .del-msg .i { width:13px; height:13px; }
  .b .del-msg:hover { opacity:1; }

  .bar { display:flex; align-items:center; gap:7px; padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px); background:var(--surface); border-top:1px solid var(--ligne); flex-shrink:0; }
  .bar input { flex:1; border:1px solid var(--ligne); border-radius:18px; padding:11px 15px; font-size:15.5px; min-width:0; background:var(--barre); } .bar input:focus { outline:none; border-color:var(--accent); }
  .send { width:45px; height:45px; border-radius:16px; background:var(--fab-bg); color:#fff; flex-shrink:0; display:grid; place-items:center; box-shadow:0 4px 12px rgba(16,185,129,.3); transition:transform .1s; }
  .send:active { transform:scale(.92); }

  /* Anneaux Statuts agrandis */
  .ring { width:62px; height:62px; border-radius:21px; display:grid; place-items:center; padding:2.5px; border:2.5px solid var(--accent); flex-shrink:0; }
  .ring .av { width:100%; height:100%; border-radius:17px; font-size:21px; }
  .ring.add { border:2px dashed var(--jaune); color:var(--jaune); }
  .ring.add .i { width:26px; height:26px; }

  .mic { width:40px; height:40px; border-radius:13px; background:var(--barre); color:var(--gris); flex-shrink:0; display:grid; place-items:center; }
  .mic:active { background:var(--accent-pill); color:var(--accent-pill-txt); }
  .ic2 { background:none; color:#f43f5e; padding:0 10px; display:grid; place-items:center; }
  .rec { flex:1; display:flex; align-items:center; gap:8px; color:#f43f5e; font-weight:700; padding-left:6px; }
  .rec i { width:10px; height:10px; border-radius:50%; background:#f43f5e; animation:bl 1s infinite; } @keyframes bl { 50% { opacity:.2; } }

  /* Modales & Visionneuse Photo de Profil Grand Format */
  .ov { position:fixed; inset:0; background:rgba(3,7,18,.72); backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet { background:var(--card-bg); border-top:1px solid var(--ligne); width:100%; max-width:520px; border-radius:26px 26px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px); display:flex; flex-direction:column; gap:11px; max-height:86dvh; overflow:auto; box-shadow:0 -10px 35px rgba(0,0,0,.4); }
  .sheet button { padding:14px; border-radius:15px; background:var(--barre); font-size:15.5px; font-weight:700; } .sheet .gr { background:none; color:var(--gris); }
  .sheet .danger { color:#f43f5e; background:rgba(244,63,94,.12); }
  .sv { position:fixed; inset:0; background:#000; z-index:30; display:flex; flex-direction:column; color:#fff; }
  .bars { display:flex; gap:4px; padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px; } .bars i { flex:1; height:3px; background:rgba(255,255,255,.35); border-radius:2px; } .bars i.f { background:#fff; }
  .sh { display:flex; align-items:center; gap:10px; padding:6px 12px; position:relative; z-index:2; } .sh .av { width:42px; height:42px; border-radius:14px; font-size:16px; } .sh b { flex:1; } .sh span { font-size:12px; opacity:.7; } .sh button { background:none; color:#fff; font-size:20px; }
  .sb { flex:1; display:grid; place-items:center; min-height:0; } .sb img { max-width:100%; max-height:100%; object-fit:contain; }
  .tx { width:100vw; height:100%; display:grid; place-items:center; text-align:center; padding:30px; font-size:26px; font-weight:700; overflow-wrap:anywhere; }
  .zl, .zr { position:absolute; top:100px; bottom:0; width:50%; } .zl { left:0; } .zr { right:0; }

  .tabs { display:flex; background:var(--tab-bg); border-radius:14px; padding:4px; margin:6px 0 4px; } .tabs button { flex:1; padding:10px; border-radius:11px; background:none; font-weight:700; color:var(--gris); } .tabs button.on { background:var(--card-bg); color:var(--vert2); box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .cta.out { background:transparent; color:#f43f5e; border:1.5px solid #f43f5e; box-shadow:none; }
  .cta.alt { background:var(--card-bg); color:var(--vert2); border:1.5px solid var(--vert2); box-shadow:none; }
  .badge { background:var(--accent); color:#042f2e; font-weight:800; font-size:12px; min-width:22px; height:22px; border-radius:11px; display:grid; place-items:center; padding:0 6px; flex-shrink:0; }
  .top .who { flex:1; min-width:0; cursor:pointer; } .top .who b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .top .who small { font-size:12.5px; color:var(--gris); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .b .nm { display:block; font-size:12.5px; font-weight:700; margin-bottom:2px; } .b .meta .t2 { color:#38bdf8; }
  .pick { display:flex; align-items:center; gap:12px; font-size:16px; font-weight:500; color:inherit; padding:8px 10px; margin:0; background:var(--card-bg); border:1px solid var(--ligne); border-radius:15px; } .pick .av { width:44px; height:44px; border-radius:14px; font-size:16px; } .pick small { color:var(--gris); } .pick input { width:20px; height:20px; accent-color:var(--vert); }

  /* Photo de profil dans Réglages nettement agrandie */
  .ppic { background:var(--card-bg); border:1px solid var(--ligne); border-radius:22px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--vert2); box-shadow:var(--card-shadow); }
  .ppic .av { width:132px; height:132px; border-radius:36px; font-size:48px; border:3px solid var(--accent); box-shadow:0 10px 26px rgba(16,185,129,.25); }
  .ppic-actions { display:flex; gap:10px; justify-content:center; width:100%; }
  .ppic-actions button { padding:8px 14px; border-radius:12px; font-size:13.5px; font-weight:700; background:var(--accent-pill); color:var(--accent-pill-txt); }

  /* Group Info & Admin Badges */
  .adm-tag { font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; background:var(--accent-pill); color:var(--accent-pill-txt); flex-shrink:0; }
  .sup-tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(245,158,11,.18); color:var(--jaune); flex-shrink:0; }
  .mrow { display:flex; align-items:center; gap:11px; padding:10px 6px; border-bottom:1px solid var(--ligne); }
  .mrow .av { width:46px; height:46px; border-radius:15px; font-size:17px; }
  .mrow .minfo { flex:1; min-width:0; }
  .mrow .minfo b { display:block; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mrow .minfo small { color:var(--gris); font-size:12.5px; }
  .mact { background:var(--search-bg); color:var(--texte); font-size:12.5px; font-weight:700; padding:7px 11px; border-radius:11px; }
  .mact.del { color:#f43f5e; background:rgba(244,63,94,.12); }
  .add-box { display:flex; gap:8px; margin-top:6px; }
  .add-box select { width:92px; flex-shrink:0; padding:10px 8px; font-size:15px; }
  .add-box input { padding:10px 12px; font-size:15px; }
  .add-box button { padding:10px 14px; border-radius:12px; background:var(--fab-bg); color:#fff; font-weight:700; flex-shrink:0; }

  /* Support / Service Client Card */
  .sup-card { background:var(--card-bg); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:12px; margin-top:8px; border:1px solid var(--ligne); box-shadow:var(--card-shadow); }
  .sup-head { display:flex; align-items:center; gap:12px; }
  .sup-ic { width:46px; height:46px; border-radius:15px; background:var(--accent-pill); color:var(--accent-pill-txt); display:grid; place-items:center; flex-shrink:0; }
  .sup-head div b { display:block; font-size:16px; }
  .sup-head div small { color:var(--gris); font-size:13px; }
  .sup-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .sup-btns button { flex:1; min-width:130px; padding:11px 12px; border-radius:13px; background:var(--barre); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--champ-bord); }
  .sup-btns button.pri { background:var(--fab-bg); color:#fff; border:0; }

  .i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
  .vp{display:flex;align-items:center;gap:9px;min-width:200px;padding:2px 0}
  .vpb{width:35px;height:35px;border-radius:12px;background:var(--vert);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .vpb .i{width:17px;height:17px}
  .vb{flex:1;height:5px;border-radius:3px;background:rgba(148,163,184,.35);cursor:pointer}
  .vf{height:100%;width:0;background:var(--jaune);border-radius:3px}
  .vt{font-size:12px;opacity:.85;min-width:32px;text-align:right}

  /* Barre de navigation inférieure flottante et moderne */
  .nav { display:flex; flex-shrink:0; background:var(--header-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--ligne); padding:7px 12px calc(env(safe-area-inset-bottom,0px) + 7px); gap:6px; }
  .nav button { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; color:var(--gris); font-size:12px; font-weight:600; padding:4px 0; transition:color .15s; }
  .nav button.on { color:var(--accent-pill-txt); }
  .nav .nav-ic { position:relative; width:58px; height:32px; border-radius:14px; display:grid; place-items:center; transition:background .15s, transform .12s; }
  .nav button.on .nav-ic { background:var(--accent-pill); color:var(--accent-pill-txt); transform:translateY(-1px); }
  .nav button.on span { font-weight:800; }
  .nav .nav-bdg { position:absolute; top:-4px; right:7px; background:var(--jaune); color:#0f172a; font-size:10.5px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:grid; place-items:center; padding:0 4px; border:2px solid var(--surface); }

  .sec{padding:12px 6px 4px;font-size:12.5px;font-weight:800;color:var(--vert2);text-transform:uppercase;letter-spacing:.5px}

function filteredChats() {

/* Ouverture directe du chat avec le Service Client Brother */
async function openSupportChat(prefillMsg = '') {
  try {
    // 1. Chercher d'abord un compte existant marqué support ou avec le numéro support
    const existingSupportId = Object.keys(users).find(id => id !== uid && isSupportUser(users[id]));
    let targetUid = existingSupportId;
    if (!targetUid) {
      const candidates = [
        SUPPORT_PHONE,
        SUPPORT_PHONE_ALT
      ].filter(Boolean);
      let ph = null;
      for (const cand of candidates) {
        const snap = await getDoc(doc(db, 'phones', cand));
        if (snap.exists() && snap.data() && snap.data().uid) {
          ph = snap;
          break;
        }
      }
      if (!ph) {
        alert('Le compte Service Client (' + SUPPORT_PHONE + ') n’est pas encore activé sur l’application.');
        return;
      }
      targetUid = ph.data().uid;
    }
    if (targetUid === uid) {
      alert('Tu es déjà connecté avec le compte Service Client.');
      return;
    }
    const us = await getDoc(doc(db, 'users', targetUid));
    if (!us.exists()) {
      alert('Compte Service Client introuvable.');
      return;
    }
    users[us.id] = { role: 'support', ...us.data() };
    await openDirect({ uid: us.id, ...users[us.id] });
    if (prefillMsg && $('txt')) {
      $('txt').value = prefillMsg;
      $('txt').focus();
    }
  } catch (e) {
    alert(errText(e));
  }
}

function detectComplaintAutoReply(text) {
  const low = (text || '').toLowerCase();
  if (low.includes('compte') || low.includes('connexion') || low.includes('mot de passe') || low.includes('bloqué') || low.includes('bloque')) {
    return SUPPORT_COMPLAINTS[0].reply;
  }
  if (low.includes('arnaque') || low.includes('insulte') || low.includes('harc') || low.includes('abus') || low.includes('menace') || low.includes('signal')) {
    return SUPPORT_COMPLAINTS[1].reply;
  }
  if (low.includes('bug') || low.includes('erreur') || low.includes('vocal') || low.includes('photo') || low.includes('charge') || low.includes('plante')) {
    return SUPPORT_COMPLAINTS[2].reply;
  }
  if (low.includes('groupe') || low.includes('admin')) {
    return SUPPORT_COMPLAINTS[3].reply;
  }
  const complaintWords = ['plainte', 'plaindre', 'problème', 'probleme', 'souci', 'aide', 'support', 'réclamation', 'reclamation'];
  if (complaintWords.some(w => low.includes(w)) || low.startsWith('[plainte')) {
    return SUPPORT_COMPLAINTS[4].reply;
  }
  return '';
}

async function deleteOwnAccount() {
  if (!auth.currentUser || !uid) return;
  const firstOk = confirm('⚠️ Supprimer définitivement ton compte Brother ? Ton profil, tes statuts et ta session seront supprimés de la base de données.');
  if (!firstOk) return;
  const typed = prompt('Tape SUPPRIMER en majuscules pour confirmer la suppression définitive de ton compte :');
  if (typed !== 'SUPPRIMER') {
    alert('Suppression annulée.');
    return;
  }

  let pw = '';
  const needsPw = !(auth.currentUser.providerData || []).some(p => p.providerId === 'google.com');
  if (needsPw) {
    pw = prompt('Entre ton mot de passe actuel pour confirmer la suppression :') || '';
    if (!pw) {
      alert('Mot de passe requis pour supprimer le compte.');
      return;
    }
  }

  const errEl = $('err');
  if (errEl) errEl.textContent = '';
  const delBtn = $('delAcc');
  if (delBtn) delBtn.disabled = true;

  busy = true;
  try {
    if (needsPw && me && me.phone) {
      const cred = EmailAuthProvider.credential(mail(me.phone), pw);
      await reauthenticateWithCredential(auth.currentUser, cred);
    }

    // Supprimer les statuts de l'utilisateur
    try {
      const stSnap = await getDocs(collection(db, 'users', uid, 'stories'));
      await Promise.all(stSnap.docs.map(d => deleteDoc(doc(db, 'users', uid, 'stories', d.id)).catch(() => {})));
    } catch (e) {}

    // Retirer l'utilisateur des discussions / groupes où il est membre
    try {
      const chSnap = await getDocs(query(collection(db, 'chats'), where('members', 'array-contains', uid)));
      await Promise.all(chSnap.docs.map(d => {
        const data = d.data() || {};
        const nextAdmins = Array.isArray(data.admins) ? data.admins.filter(x => x !== uid) : [];
        const patch = { members: arrayRemove(uid), admins: nextAdmins };
        if (data.admin === uid) patch.admin = '';
        return setDoc(doc(db, 'chats', d.id), patch, { merge: true }).catch(() => {});
      }));
    } catch (e) {}

    // Supprimer le document blocks/{uid} et users/{uid}
    try { await deleteDoc(doc(db, 'blocks', uid)); } catch (e) {}
    await deleteDoc(doc(db, 'users', uid));

    // Supprimer le compte Firebase Auth
    await deleteUser(auth.currentUser);

    stopSubs();
    uid = null;
    me = null;
    busy = false;
    view = 'welcome';
    render();
    alert('Ton compte a été supprimé définitivement.');
  } catch (e) {
    busy = false;
    if (delBtn) delBtn.disabled = false;
    const msg = (e && e.code || '').includes('wrong-password') || (e && e.code || '').includes('invalid-credential')
      ? 'Mot de passe incorrect. Suppression annulée.'
      : ((e && e.code || '').includes('requires-recent-login')
          ? 'Session expirée : déconnecte-toi, reconnecte-toi puis réessaie la suppression.'
          : errText(e));
    if (errEl) errEl.textContent = msg;
    alert(msg);
  }
}

/* ---- Vocaux : micro -> PCM 8 kHz -> µ-law ---- */
const AUD_PFX = 'data:audio/x-mulaw8k;base64,';
const lin2u = v => { const sg = (v >> 8) & 0x80; if (sg) v = -v; if (v > 32635) v = 32635; v += 0x84; let e = 7; for (let m = 0x4000; (v & m) === 0 && e > 0; e--, m >>= 1); return ~(sg | (e << 4) | ((v >> (e + 3)) & 15)) & 255; };

function toULaw(chunks, sr) {

  const all = new Float32Array(n); let o = 0, peak = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(all[i]));
  const g = peak > .01 ? Math.min(4, .9 / peak) : 1, r = sr / 8000, len = Math.floor(n / r), out = new Uint8Array(len);
  for (let i = 0; i < len; i++) { const a = Math.floor(i * r), b = Math.max(a + 1, Math.floor((i + 1) * r)); let v = 0; for (let j = a; j < b; j++) v += all[j]; out[i] = lin2u(Math.round(Math.max(-1, Math.min(1, g * v / (b - a))) * 32000)); }
  let bin = ''; for (let i = 0; i < len; i += 8192) bin += String.fromCharCode.apply(null, out.subarray(i, i + 8192));
  return AUD_PFX + btoa(bin);
}
function wavURL(du) {
  const bin = atob(du.slice(AUD_PFX.length)), n = bin.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, u2lin(bin.charCodeAt(i)), true);

}
async function startRec() {
  if (rec) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!navigator.mediaDevices || !AC) return alert('Ce navigateur ne permet pas d’enregistrer.');
  const ctx = new AC(); try { ctx.resume(); } catch (e) {}
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { try { ctx.close(); } catch (x) {} return alert('Autorise le micro pour envoyer un vocal (l’appli doit être ouverte en https).'); }
  const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1);
  rec = { ctx, stream, src, proc, chunks: [], t0: Date.now(), cid: openId };
  proc.onaudioprocess = e => { if (rec) rec.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(proc); proc.connect(ctx.destination);
  rec.timer = setInterval(() => { const x = Math.floor((Date.now() - rec.t0) / 1000), t = $('rt'); if (t) t.textContent = fmt(x); if (x >= 60) stopRec(true); }, 250);
  renderBar();
}
async function stopRec(send) {
  const r = rec; if (!r) return; rec = null; clearInterval(r.timer);
  try { r.proc.disconnect(); r.src.disconnect(); } catch (e) {}
  r.stream.getTracks().forEach(t => t.stop()); const sr = r.ctx.sampleRate; try { r.ctx.close(); } catch (e) {}
  renderBar();
  const dur = Math.round((Date.now() - r.t0) / 1000);
  if (!send || dur < 1 || !r.chunks.length) return;
  const data = toULaw(r.chunks, sr);
  if (data.length > 900000) return alert('Vocal trop long.');
  try {
    await addDoc(collection(db, 'chats', r.cid, 'messages'), { from: uid, text: '🎤 Message vocal (' + fmt(dur) + ')', audio: data, dur, at: serverTimestamp() });
    await touchChat(r.cid, '🎤 Message vocal (' + fmt(dur) + ')');
  } catch (e) { alert(errText(e)); }
}

function showImage(src, label = '', isMedia = false) {

function pickImage(max, quality, limit) {
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return res(null);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); let q = quality, d = c.toDataURL('image/jpeg', q); while (limit && d.length > limit && q > .35) { q -= .1; d = c.toDataURL('image/jpeg', q); } if (limit && d.length > limit) { alert('Photo trop lourde : choisis-en une plus petite.'); return res(null); } res(d);
      };
      img.onerror = () => res(null); img.src = URL.createObjectURL(f);
    };
    inp.click();
  });
}
