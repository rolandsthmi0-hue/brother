<style>
  :root {

    --jaune:#f4b942; --sable:#efeae2; --sortant:#d9fdd3; --gris:#667781;

    --fab-bg:#25d366; --fab-txt:#ffffff;
  }
  body.dark {
    --vert:#00a884; --vert2:#25d366; --accent:#25d366; --accent-pill:#103529; --accent-pill-txt:#25d366;
    --fond-ext:#0b141a; --surface:#0b141a; --header-bg:#0b141a; --header-txt:#e9edef;

    --fab-bg:#25d366; --fab-txt:#0b141a;

  .top h1 { font-size:23px; font-weight:700; margin:0; flex:1; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--header-txt); }
  body:not(.dark) .top.main-top h1 { color:#00a884; }
  .top .ic { background:transparent; color:var(--header-txt); width:38px; height:38px; padding:0; border-radius:50%; display:grid; place-items:center; }
  .top .ic:active { background:var(--search-bg); }
  .top b { font-size:17px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .av { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font-weight:700; color:#fff; flex-shrink:0; font-size:18px; }

  /* Barre de recherche & Filtres (Pills) */
  .search-wrap { padding:4px 14px 8px; background:var(--surface); flex-shrink:0; }

  .search-box input:focus { outline:none; }
  .search-box input::placeholder { color:var(--gris); }
  .search-clear { background:none; color:var(--gris); padding:2px; display:grid; place-items:center; }

  .chips { display:flex; gap:8px; padding:2px 14px 10px; overflow-x:auto; flex-shrink:0; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { background:var(--search-bg); color:var(--gris); font-size:13.5px; font-weight:600; padding:6px 14px; border-radius:18px; white-space:nowrap; flex-shrink:0; transition:background .15s, color .15s; }
  .chip.on { background:var(--accent-pill); color:var(--accent-pill-txt); }

  /* Welcome / Login */
  .welcome { flex:1; overflow:auto; padding:calc(env(safe-area-inset-top,0px) + 34px) 26px 30px; display:flex; flex-direction:column; gap:8px; }
  .logo { width:72px; height:72px; } .logo svg { display:block; }
  .welcome h1 { margin:6px 0 0; font-size:30px; color:var(--vert2); }
  .welcome p { margin:0 0 8px; color:var(--gris); line-height:1.4; }
  label { font-size:13.5px; font-weight:600; color:var(--vert2); margin-top:6px; }
  .field { border:1.5px solid var(--champ-bord); border-radius:12px; padding:13px 14px; font-size:16.5px; width:100%; background:var(--surface); }

  .err { color:#f15c6d; font-size:14px; min-height:18px; }

  .fab { position:absolute; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 78px); width:56px; height:56px; border-radius:16px; background:var(--fab-bg); color:var(--fab-txt); box-shadow:0 4px 14px rgba(0,0,0,.35); display:grid; place-items:center; transition:transform .1s; z-index:5; }
  .fab:active { transform:scale(.93); }

  /* Zone de chat */
  .msgs { flex:1; overflow:auto; background-color:var(--sable); background-image:radial-gradient(rgba(134,150,160,.12) 1.2px,transparent 1.3px); background-size:20px 20px; padding:12px 10px; display:flex; flex-direction:column; gap:4px; }
  .b { max-width:82%; padding:8px 12px 6px; font-size:15.5px; line-height:1.35; overflow-wrap:anywhere; box-shadow:0 1px 1px rgba(0,0,0,.14); position:relative; animation:pop .16s ease-out; }
  .b.in { background:var(--barre); align-self:flex-start; border-radius:14px 14px 14px 4px; }

  .b.out { background:var(--sortant); align-self:flex-end; border-radius:14px 14px 4px 14px; }
  @keyframes pop{from{opacity:0;transform:translateY(5px)}}

  .b .del-msg { background:none; padding:0; display:inline-grid; place-items:center; width:18px; height:18px; opacity:.65; }

  .send { width:44px; height:44px; border-radius:50%; background:var(--vert); color:#fff; flex-shrink:0; display:grid; place-items:center; transition:transform .1s; }
  .send:active { transform:scale(.92); }
  img.av { object-fit:cover; background:#2a3942; } .top .ic .av { width:34px; height:34px; font-size:15px; }

  /* Anneaux Statuts style WhatsApp (bordure verte) */
  .ring { width:54px; height:54px; border-radius:50%; display:grid; place-items:center; padding:2.5px; border:2.5px solid var(--accent); flex-shrink:0; }
  .ring .av { width:100%; height:100%; font-size:19px; }
  .ring.add { border:2px dashed var(--gris); color:var(--accent); }
  .ring.add .i { width:24px; height:24px; }

  .mic { width:40px; height:40px; border-radius:50%; background:transparent; color:var(--gris); flex-shrink:0; display:grid; place-items:center; }
  .mic:active { background:var(--barre); }
  .ic2 { background:none; color:#f15c6d; padding:0 10px; display:grid; place-items:center; }
  .rec { flex:1; display:flex; align-items:center; gap:8px; color:#f15c6d; font-weight:600; padding-left:6px; }
  .rec i { width:10px; height:10px; border-radius:50%; background:#f15c6d; animation:bl 1s infinite; } @keyframes bl { 50% { opacity:.2; } }

  /* Modales & Visionneuse */
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet { background:var(--barre); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px); display:flex; flex-direction:column; gap:10px; }
  .sheet button { padding:14px; border-radius:14px; background:var(--surface); font-size:16.5px; font-weight:600; } .sheet .gr { background:none; color:var(--gris); }
  .sv { position:fixed; inset:0; background:#000; z-index:30; display:flex; flex-direction:column; color:#fff; }
  .bars { display:flex; gap:4px; padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px; } .bars i { flex:1; height:3px; background:rgba(255,255,255,.35); border-radius:2px; } .bars i.f { background:#fff; }
  .sh { display:flex; align-items:center; gap:10px; padding:6px 12px; position:relative; z-index:2; } .sh .av { width:36px; height:36px; font-size:15px; } .sh b { flex:1; } .sh span { font-size:12px; opacity:.7; } .sh button { background:none; color:#fff; font-size:20px; }
  .sb { flex:1; display:grid; place-items:center; min-height:0; } .sb img { max-width:100%; max-height:100%; object-fit:contain; }
  .tx { width:100vw; height:100%; display:grid; place-items:center; text-align:center; padding:30px; font-size:26px; font-weight:700; overflow-wrap:anywhere; }
  .zl, .zr { position:absolute; top:100px; bottom:0; width:50%; } .zl { left:0; } .zr { right:0; }

  .tabs { display:flex; background:var(--tab-bg); border-radius:12px; padding:4px; margin:6px 0 4px; } .tabs button { flex:1; padding:10px; border-radius:9px; background:none; font-weight:600; color:var(--gris); } .tabs button.on { background:var(--surface); color:var(--vert2); box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .cta.out { background:transparent; color:#f15c6d; border:1.5px solid #f15c6d; }
  .cta.alt { background:transparent; color:var(--vert2); border:1.5px solid var(--vert2); }
  .badge { background:var(--accent); color:#0b141a; font-weight:700; font-size:12px; min-width:21px; height:21px; border-radius:11px; display:grid; place-items:center; padding:0 6px; flex-shrink:0; }
  .top .who { flex:1; min-width:0; } .top .who b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .top .who small { font-size:12.5px; color:var(--gris); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .b .nm { display:block; font-size:12.5px; font-weight:700; margin-bottom:2px; } .b .meta .t2 { color:#53bdeb; }

  .i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
  .vp{display:flex;align-items:center;gap:9px;min-width:200px;padding:2px 0}
  .vpb{width:34px;height:34px;border-radius:50%;background:var(--vert);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .vpb .i{width:17px;height:17px}
  .vb{flex:1;height:5px;border-radius:3px;background:rgba(134,150,160,.3);cursor:pointer}
  .vf{height:100%;width:0;background:var(--accent);border-radius:3px}
  .vt{font-size:12px;color:var(--gris);min-width:32px;text-align:right}

  /* Barre de navigation inférieure style WhatsApp (pilule verte active + badge) */
  .nav { display:flex; flex-shrink:0; background:var(--surface); border-top:1px solid var(--ligne); padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px); }
  .nav button { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; color:var(--texte); font-size:12px; font-weight:500; padding:4px 0; }
  .nav .nav-ic { position:relative; width:56px; height:30px; border-radius:16px; display:grid; place-items:center; transition:background .15s; }
  .nav button.on .nav-ic { background:var(--accent-pill); color:var(--accent-pill-txt); }
  .nav button.on span { font-weight:700; }
  .nav .nav-bdg { position:absolute; top:-3px; right:8px; background:var(--accent); color:#0b141a; font-size:10.5px; font-weight:700; min-width:17px; height:17px; border-radius:9px; display:grid; place-items:center; padding:0 4px; border:2px solid var(--surface); }

  .sec{padding:12px 16px 4px;font-size:13px;font-weight:700;color:var(--gris)}
  .set{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:var(--texte);padding:14px 0;margin:8px 0 0;border-top:1px solid var(--ligne)}
  .sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--champ-bord);position:relative;transition:background .2s;flex-shrink:0;margin:0}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  .sw:checked{background:var(--vert)} .sw:checked::after{left:23px}
  .mi{display:block;max-width:100%;max-height:300px;border-radius:12px;object-fit:cover;cursor:zoom-in;margin-bottom:2px}
  .top img.av{cursor:zoom-in}
  .pv{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 50px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
  .pv img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .pv .ic{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;color:#fff;width:40px;height:40px;padding:0;border-radius:50%;background:rgba(255,255,255,.15)}
  .rpv{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--barre);border-left:4px solid var(--accent)}
  .rpv div{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px} .rpv b{color:var(--vert2)} .rpv span{color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qt{background:rgba(0,0,0,.12);border-left:3px solid var(--accent);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:13px;color:var(--gris);display:flex;flex-direction:column}
  .qt b{color:var(--vert2);font-size:12px}
  .emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:190px;overflow:auto;background:var(--barre);padding:6px 8px;border-top:1px solid var(--ligne)}
  .emo button{background:none;font-size:24px;padding:4px 0}
  .rpv[hidden],.emo[hidden]{display:none}
  .upd{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;background:var(--accent);color:#0b141a;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .upd button{background:#0b141a;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
  .lnk{background:none;color:var(--vert2);font-weight:700;font-size:15px;padding:6px 0}
  #pwbox[hidden]{display:none} .blk{flex:1;text-align:center;color:var(--gris);padding:12px}
</style>

const nameOf = id => id === uid ? 'Mon statut' : ((users[id] && users[id].name) || 'Ami');
function addStory() {
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = `<div class="sheet"><b>Nouvelle actu (24 h)</b><button id="sp">📷 Photo</button><button id="stx">✏️ Texte</button><button id="sc" class="gr">Annuler</button></div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.querySelector('#sc').onclick = close;
  o.querySelector('#sp').onclick = async () => { close(); const p = await pickImage(720, .6, 650000); if (p) postStory({ type: 'image', img: p }); };
  o.querySelector('#stx').onclick = () => { close(); const t = (prompt('Écris ton statut') || '').trim().slice(0, 200); if (t) postStory({ type: 'text', text: t, bg: BGS[Math.floor(Math.random() * BGS.length)] }); };
}
async function postStory(d) {
  const now = Date.now();
  try { await addDoc(collection(db, 'users', uid, 'stories'), { uid, ...d, at: now, expiresAt: now + 864e5 }); } catch (e) { alert(errText(e)); }
}
function viewStories(id) {
  const list = stories.filter(x => x.uid === id && x.expiresAt > Date.now()); if (!list.length) return;
  let i = 0; const o = document.createElement('div'); o.className = 'sv'; document.body.appendChild(o);
  const end = () => { clearTimeout(svT); o.remove(); };
  const next = () => { if (i < list.length - 1) { i++; show(); } else end(); };
  function show() {
    clearTimeout(svT); const x = list[i];
    const body = x.type === 'image' && okImg(x.img) ? `<img src="${x.img}" alt="">` : `<div class="tx" style="background:${BGS.includes(x.bg) ? x.bg : BGS[0]}">${esc(x.text || '')}</div>`;
    o.innerHTML = `<div class="bars">${list.map((_, k) => `<i class="${k <= i ? 'f' : ''}"></i>`).join('')}</div><div class="sh">${av(nameOf(id), id)}<b>${esc(nameOf(id))}</b><span>${hhmm(x.at)}</span>${id === uid ? `<button id="sseen">👁 ${(x.views || []).length}</button><button id="sdel">🗑</button>` : ''}<button id="sx">✕</button></div><div class="sb">${body}</div><div class="zl"></div><div class="zr"></div>`;
    o.querySelector('#sx').onclick = end;
    if (id !== uid && !(x.views || []).includes(uid)) setDoc(doc(db, 'users', id, 'stories', x.id), { views: arrayUnion(uid) }, { merge: true }).catch(() => {});
    const sn = o.querySelector('#sseen'); if (sn) sn.onclick = () => { clearTimeout(svT); alert((x.views || []).length ? 'Vu par : ' + x.views.map(nameOf).join(', ') : 'Personne n’a encore vu ce statut.'); svT = setTimeout(next, 5000); };
    const d = o.querySelector('#sdel'); if (d) d.onclick = async () => { if (confirm('Supprimer ce statut ?')) { try { await deleteDoc(doc(db, 'users', uid, 'stories', x.id)); } catch (e) {} end(); } };
    o.querySelector('.zl').onclick = () => { if (i > 0) { i--; show(); } };
    o.querySelector('.zr').onclick = next; svT = setTimeout(next, 5000);
  }
  show();
}
